name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: The device, protocol or situation, and what is missing today
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it look?
      description: An API sketch or example code, if you have one
      render: actionscript
