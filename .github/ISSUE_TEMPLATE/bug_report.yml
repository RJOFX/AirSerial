name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The details below let it be reproduced quickly.
  - type: input
    id: version
    attributes:
      label: AirSerial version
      description: Output of `trace(Serial.VERSION, Serial.nativeVersion)`
      placeholder: 1.0.0  1.0.0 (Windows x64)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and AIR SDK
      placeholder: Windows 11 23H2, AIR SDK 51.2, Animate 2023, 64-bit app
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / USB adapter / driver
      placeholder: Arduino Uno (CH340), FTDI FT232R, on-board COM1, com0com ...
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code
      description: A few lines that show the problem
      render: actionscript
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error messages, `port.lastError`, `trace(port.stats)`
      render: text
